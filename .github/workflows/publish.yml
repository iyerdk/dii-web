name: Publish Edition

on:
  push:
    branches: [main]
    paths:
      - "research/20**.md"   # fires whenever a weekly research file is committed
  schedule:
    - cron: "0 7 * * 1"     # Monday 07:00 UTC — safety net if push trigger missed
  workflow_dispatch:         # manual trigger from GitHub UI
    inputs:
      research_file:
        description: "Research file path (e.g. research/2026-20.md). Leave blank for current week."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve research file (push trigger)
        if: github.event_name == 'push'
        id: pushed_file
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          file=$(python3 - <<'PYEOF'
          import json, os, re
          payload = json.loads(os.environ["EVENT_PAYLOAD"])
          head = payload.get("head_commit", {})
          files = head.get("added", []) + head.get("modified", [])
          match = next((f for f in files if re.match(r"research/20\d{2}-\d{2}\.md$", f)), "")
          print(match)
          PYEOF
          )
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publish edition
        env:
          DII_WEBHOOK_URL: ${{ secrets.DII_WEBHOOK_URL }}
          DII_WEBHOOK_SECRET: ${{ secrets.DII_WEBHOOK_SECRET }}
        run: |
          FILE="${{ steps.pushed_file.outputs.file || inputs.research_file }}"
          if [ -n "$FILE" ]; then
            python scripts/publish_edition.py "$FILE"
          else
            python scripts/publish_edition.py
          fi
